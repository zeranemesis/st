name: Spirit Tracks EUR1 boolean conditional ARM matching

on:
  push:
    paths:
      - 'research/eur1/batches/arm9_leaf500/search_boolean_round28.py'
      - '.github/workflows/research-eur1-boolean-round28.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile ARM CMP and TST boolean C candidates against original instruction hashes
        run: |
          python3 research/eur1/batches/arm9_leaf500/search_boolean_round28.py --out /tmp/st-round28-boolean.json
          python3 -c 'import json; j=json.load(open("/tmp/st-round28-boolean.json")); assert j["compiled_variants"] >= 100 and j["original_functions_scanned"]>=5'
      - name: Upload exact-match candidate C source
        uses: actions/upload-artifact@v4
        with:
          name: eur1-round28-boolean-sources
          path: /tmp/st-round28-boolean.json
