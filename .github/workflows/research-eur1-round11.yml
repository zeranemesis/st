name: Spirit Tracks EUR1 typed overlay0 functions

on:
  push:
    paths:
      - 'research/eur1/batches/arm9_leaf500/semantic_refactors_round11.c'
      - 'research/eur1/batches/arm9_leaf500/verify_semantic_round11.py'
      - 'research/eur1/batches/arm9_leaf500/test_semantic_round11.c'
      - 'research/eur1/batches/arm9_leaf500/manifest_fifth500.json'
      - '.github/workflows/research-eur1-round11.yml'
  pull_request:
    paths:
      - 'research/eur1/batches/arm9_leaf500/semantic_refactors_round11.c'
      - 'research/eur1/batches/arm9_leaf500/verify_semantic_round11.py'
      - 'research/eur1/batches/arm9_leaf500/test_semantic_round11.c'
      - 'research/eur1/batches/arm9_leaf500/manifest_fifth500.json'
      - '.github/workflows/research-eur1-round11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-arm-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ten typed ARMv5TE C functions against source manifest SHA256
        run: |
          python3 -m py_compile research/eur1/batches/arm9_leaf500/verify_semantic_round11.py
          python3 research/eur1/batches/arm9_leaf500/verify_semantic_round11.py --out /tmp/round11-hash-results.json
      - name: Test nine host semantic function groups with sanitizers
        run: |
          clang -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Werror research/eur1/batches/arm9_leaf500/test_semantic_round11.c -o /tmp/round11-semantic-tests
          /tmp/round11-semantic-tests
