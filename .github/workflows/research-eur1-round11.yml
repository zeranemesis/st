name: Spirit Tracks EUR1 typed overlay0 functions

on:
  push:
    paths:
      - 'research/eur1/batches/arm9_leaf500/semantic_refactors_round11.c'
      - 'research/eur1/tests/test_ui_counter_6590c_integration.py'
      - 'src/000_Second/code_020657fc.cpp'
      - 'include/Unknown/UICounterManager.hpp'
      - 'research/eur1/batches/arm9_leaf500/verify_semantic_round11.py'
      - 'research/eur1/batches/arm9_leaf500/verify_codewarrior_round11.py'
      - 'research/eur1/batches/arm9_leaf500/test_semantic_round11.c'
      - 'research/eur1/batches/arm9_leaf500/manifest_fifth500.json'
      - '.github/workflows/research-eur1-round11.yml'
  pull_request:
    paths:
      - 'research/eur1/batches/arm9_leaf500/semantic_refactors_round11.c'
      - 'research/eur1/tests/test_ui_counter_6590c_integration.py'
      - 'src/000_Second/code_020657fc.cpp'
      - 'include/Unknown/UICounterManager.hpp'
      - 'research/eur1/batches/arm9_leaf500/verify_semantic_round11.py'
      - 'research/eur1/batches/arm9_leaf500/verify_codewarrior_round11.py'
      - 'research/eur1/batches/arm9_leaf500/test_semantic_round11.c'
      - 'research/eur1/batches/arm9_leaf500/manifest_fifth500.json'
      - '.github/workflows/research-eur1-round11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-arm-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ten typed ARMv5TE C functions against source manifest SHA256
        run: |
          python3 -m py_compile research/eur1/batches/arm9_leaf500/verify_semantic_round11.py
          python3 research/eur1/batches/arm9_leaf500/verify_semantic_round11.py --out /tmp/round11-hash-results.json
      - name: Smoke-test original-compiler harness using portable Clang backend (NOT CodeWarrior)
        run: |
          python3 -m py_compile research/eur1/batches/arm9_leaf500/verify_codewarrior_round11.py
          python3 research/eur1/batches/arm9_leaf500/verify_codewarrior_round11.py --backend clang --out /tmp/round11-clang-smoke.json
          python3 -c 'import json; j=json.load(open("/tmp/round11-clang-smoke.json")); assert j["backend"]=="clang" and j["functions_checked"]==10 and sum(j["counts"].values())==10'
      - name: Compile actual UICounter 0x0206590C C++ and validate field writes
        run: python3 research/eur1/tests/test_ui_counter_6590c_integration.py
      - name: Test nine host semantic function groups with sanitizers
        run: |
          clang -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Werror research/eur1/batches/arm9_leaf500/test_semantic_round11.c -o /tmp/round11-semantic-tests
          /tmp/round11-semantic-tests
