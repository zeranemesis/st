name: Spirit Tracks EUR1 research checks

on:
  push:
    paths:
      - 'research/eur1/src/**'
      - 'research/eur1/tests/**'
      - 'research/eur1/scripts/**'
      - 'research/eur1/probes/**'
      - 'research/eur1/batches/**'
      - '.github/workflows/research-eur1.yml'
  pull_request:
    paths:
      - 'research/eur1/src/**'
      - 'research/eur1/tests/**'
      - 'research/eur1/scripts/**'
      - 'research/eur1/probes/**'
      - 'research/eur1/batches/**'
      - '.github/workflows/research-eur1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python scripts
        run: |
          python3 -m py_compile research/eur1/scripts/verify_arm9_functions.py
          python3 -m py_compile research/eur1/scripts/analyze_nds.py
      - name: Host behavior tests - ARM9 wrappers
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic             -o /tmp/st-arm9-tests research/eur1/tests/test_recovered_arm9_wrappers.c
          /tmp/st-arm9-tests
      - name: Host behavior tests - Base2
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic             -o /tmp/st-base2-tests research/eur1/tests/test_base2_constructors.c
          /tmp/st-base2-tests
      - name: Syntax and ARM target compilation (NOT CodeWarrior matching)
        run: |
          clang --target=armv5te-none-eabi -march=armv5te -marm             -std=c11 -ffreestanding -Wall -Wextra -Werror             -c research/eur1/src/recovered_base2_constructors.c -o /tmp/st-base2-arm.o

      - name: Verify exact ARM instruction bytes for 0x0201BAE4
        run: python3 research/eur1/scripts/check_matching_leaf.py

      - name: Check 15 ARM9 constant-return functions (ROM-free fingerprints)
        run: python3 research/eur1/scripts/check_constant_leaf_batch.py

      - name: Audit core decompilation boundaries for future native port (ROM-free)
        run: |
          python3 -m unittest discover -s research/eur1/scripts -p 'test_decomp_readiness.py' -v
          python3 research/eur1/scripts/decomp_readiness.py --verify-core --out /tmp/spirit-tracks-decomp-readiness.json

      - name: Test ARM9 boot memory-fill semantics (ROM-free)
        run: |
          clang -std=c11 -Wall -Wextra -Werror -pedantic -o /tmp/st-fill32 research/eur1/tests/test_entry_fill32_semantics.c
          /tmp/st-fill32


      - name: Input and VCOUNT semantic regression tests (ROM-free)
        run: |
          clang -std=c11 -O1 -Wall -Wextra -Werror -pedantic -o /tmp/st-input-semantics research/eur1/tests/test_nds_input_frame_semantics.c
          /tmp/st-input-semantics

      - name: Verify two input ARM9 exact Clang-codegen probes
        run: python3 research/eur1/scripts/verify_arm9_input_exact.py

      - name: Parse CodeWarrior research verification script (no proprietary compiler required)
        run: python3 -m py_compile research/eur1/batches/ov000_100/verify_codewarrior_100.py research/eur1/batches/ov000_100/verify_codewarrior_last2.py

      - name: Compile 100 overlay0 decompilation functions (ARMv5TE, not CodeWarrior)
        run: |
          clang --target=armv5te-none-eabi -march=armv5te -marm -O2 -ffreestanding -fomit-frame-pointer -ffunction-sections -c research/eur1/batches/ov000_100/overlay000_recovered_100.c -o /tmp/st-ov000-100.o
          python3 -c 'import json; x=json.load(open("research/eur1/batches/ov000_100/manifest_100.json")); assert len(x["functions"]) == 100'

      - name: Compile additional 165 overlay0 C functions (ARMv5TE; no ROM)
        run: |
          clang --target=armv5te-none-eabi -march=armv5te -marm -O2 -ffreestanding -fomit-frame-pointer -ffunction-sections -c research/eur1/batches/ov000_165/overlay000_additional_165.c -o /tmp/st-ov000-extra165.o
          python3 -c 'import json; from pathlib import Path; a=json.loads(Path("research/eur1/batches/ov000_165/manifest_165.json").read_text())["functions"]; b=json.loads(Path("research/eur1/batches/ov000_100/manifest_100.json").read_text())["functions"]; aa=[x["address"] for x in a];bb=[x["address"] for x in b]; assert len(a)==165 and len(set(aa))==165 and not (set(aa)&set(bb))'

      - name: Compile 500 additional reconstructed ARM9 functions (no ROM required)
        run: |
          clang --target=armv5te-none-eabi -march=armv5te -marm -O2 -ffreestanding -fomit-frame-pointer -ffunction-sections -c research/eur1/batches/overlay500/overlay_recovered_500.c -o /tmp/st-overlay500.o
          python3 -m py_compile research/eur1/batches/overlay500/verify_500.py
          python3 -c 'import json; j=json.load(open("research/eur1/batches/overlay500/manifest_500.json")); assert len(j["functions"])==500; assert j["summary"]["non_empty_functions"]==211; assert j["summary"]["originally_empty_functions"]==289'

      - name: Compile third batch of 500 ARM9 C reconstructions (ROM-free smoke check)
        run: |
          clang --target=armv5te-none-eabi -march=armv5te -marm -O2 -ffreestanding -fomit-frame-pointer -ffunction-sections -c research/eur1/batches/overlay_next500/overlay_recovered_next500.c -o /tmp/st-overlay-next500.o
          python3 -m py_compile research/eur1/batches/overlay_next500/verify_next500.py
          python3 -c 'import json; x=json.load(open("research/eur1/batches/overlay_next500/manifest_next500.json")); assert len(x["functions"]) == 500; assert x["summary"]["non_empty_functions"] == 245 and x["summary"]["originally_empty_functions"] == 255'

      - name: Compile 1000 ARM9 candidate C code spans (ROM-free smoke test)
        run: |
          clang --target=armv5te-none-eabi -march=armv5te -marm -O2 -ffreestanding -fomit-frame-pointer -ffunction-sections -c research/eur1/batches/overlay_candidates_1000/candidate_reconstructions_1000.c -o /tmp/st-candidate-1000.o
          python3 -m py_compile research/eur1/batches/overlay_candidates_1000/verify_candidates_1000.py research/eur1/batches/overlay_candidates_1000/verify_codewarrior_candidates_1000.py
          python3 -c 'import json; m=json.load(open("research/eur1/batches/overlay_candidates_1000/manifest_candidates_1000.json")); assert len(m["functions"])==1000; assert m["summary"]["function_entrypoints_confirmed_by_upstream_symbols"]+m["summary"]["entrypoints_supported_by_same_overlay_function_pointers"]==323; assert m["summary"]["post_return_candidate_not_confirmed"]+m["summary"]["possible_epilogue_or_branch_fragment_not_confirmed"]==677'

      - name: Compile 500 fifth-batch ARM9 BL-referenced C research functions (ROM-free smoke)
        run: |
          for i in 1 2 3 4 5; do clang --target=armv5te-none-eabi -march=armv5te -marm -O2 -w -ffreestanding -fomit-frame-pointer -ffunction-sections -c research/eur1/batches/arm9_leaf500/arm9_leaf_500_part${i}.c -o /tmp/st-leaf500-${i}.o; done
          python3 -m py_compile research/eur1/batches/arm9_leaf500/verify_fifth500.py
          python3 -c 'import json; d=json.load(open("research/eur1/batches/arm9_leaf500/manifest_fifth500.json")); assert len(d["functions"]) == 500 and d["summary"]["standalone_clang_exact"]==33 and d["summary"]["standalone_clang_nonmatching"]==467; assert len({(x["module"],x["address"]) for x in d["functions"]})==500'

      - name: Audit fifth-batch CodeWarrior verifier using Clang smoke backend (ROM-free)
        run: |
          python3 -m py_compile research/eur1/batches/arm9_leaf500/verify_codewarrior_fifth500.py
          clang --target=armv5te-none-eabi -march=armv5te -marm -O2 -ffreestanding -c research/eur1/batches/arm9_leaf500/semantic_refactors_3.c -o /tmp/st-semantic-refactors.o
          python3 research/eur1/batches/arm9_leaf500/verify_codewarrior_fifth500.py --backend clang --batch-size 100 --out /tmp/st-cw-fifth-smoke.json
          python3 -c 'import json; j=json.load(open("/tmp/st-cw-fifth-smoke.json")); assert j["backend"]=="clang" and j["functions_checked"]==500; assert j["counts"]=={"exact_clang_smoke":33,"different_size":329,"different_instructions":138}'

      - name: Compile sixth batch of 100 new ARM9 functions and regression-check exact Clang code
        run: |
          python3 -m py_compile research/eur1/batches/arm9_new100/verify_new100.py research/eur1/batches/arm9_new100/verify_codewarrior_new100.py
          python3 research/eur1/batches/arm9_new100/verify_codewarrior_new100.py --backend clang --batch-size 50 --out /tmp/st-new100-smoke.json
          python3 -c 'import json; m=json.load(open("research/eur1/batches/arm9_new100/manifest_new100.json")); r=json.load(open("/tmp/st-new100-smoke.json")); assert len(m["functions"]) == 100 and m["summary"]["clang_exact_count"]==37; assert m["summary"]["new_typed_exact_functions"]==17; assert r["functions_checked"]==100 and r["counts"] == {"exact_clang_smoke":37,"different_instructions":21,"different_size":42}'

      - name: Compile sixth 100 ARM9 BL-referenced C reconstructions (ROM-free smoke)
        run: |
          clang --target=armv5te-none-eabi -march=armv5te -marm -O2 -ffreestanding -ffunction-sections -w -c research/eur1/batches/new100/new100.c -o /tmp/st-new100.o
          python3 -m py_compile research/eur1/batches/new100/verify_new100.py
          python3 -c 'import json; d=json.load(open("research/eur1/batches/new100/manifest_new100.json")); assert len(d["functions"])==100 and d["summary"]["clang_exact"]==17 and d["summary"]["clang_not_exact"]==83'

      - name: Compile 34 newly matched ARM9 C functions and audit 100 target statuses (ROM-free)
        run: |
          clang --target=armv5te-none-eabi -march=armv5te -marm -O2 -ffreestanding -fomit-frame-pointer -ffunction-sections -c research/eur1/batches/arm9_new34/recovered_exact_34.c -o /tmp/st-new34.o
          python3 -m py_compile research/eur1/batches/arm9_new34/verify_exact_34.py research/eur1/batches/arm9_new34/verify_codewarrior_34.py
          python3 -c 'import json; d=json.load(open("research/eur1/batches/arm9_new34/manifest_100_targets.json")); f=d["functions"]; assert len(f)==100 and len({(x["module"],x["address"]) for x in f})==100; assert sum(x["status"]=="clang_armv5te_byte_identical" for x in f)==34; assert sum(x["status"]=="BL_target_queued_no_C_reconstruction" for x in f)==66; assert sum(x["size_bytes"] for x in f[:34])==536'

      - name: Compile 100 new BL-backed ARM9 C research functions (no ROM)
        run: |
          clang --target=armv5te-none-eabi -march=armv5te -marm -O2 -ffreestanding -fomit-frame-pointer -ffunction-sections -w -c research/eur1/batches/arm9_bl100/reconstructed_100_new.c -o /tmp/st-100-bl-leaf.o
          python3 -m py_compile research/eur1/batches/arm9_bl100/verify_100_new.py
          python3 -c 'import json; m=json.load(open("research/eur1/batches/arm9_bl100/manifest_100_new.json")); f=m["functions"]; assert len(f)==100 and len({(x["overlay"],x["address"]) for x in f})==100; assert sum(x["clang_armv5te_exact"] for x in f)==50; assert sum(len(x["direct_BL_call_sites"]) for x in f)==149; assert m["summary"]["original_code_bytes"]==1924'
