name: Spirit Tracks EUR1 barrier matching search

on:
  push:
    paths:
      - 'research/eur1/batches/arm9_leaf500/search_barriers_round23.py'
      - '.github/workflows/research-eur1-barriers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile empty-asm barrier C variants and compare ARM spans
        run: |
          python3 research/eur1/batches/arm9_leaf500/search_barriers_round23.py --out /tmp/eur1-round23-barriers.json
          python3 -c 'import json; j=json.load(open("/tmp/eur1-round23-barriers.json")); assert j["compiled_source_variants"]>1000 and j["original_unmatched_tested"]>100'
      - name: Upload reproducible match evidence
        uses: actions/upload-artifact@v4
        with:
          name: st-eur1-round23-barriers
          path: /tmp/eur1-round23-barriers.json
