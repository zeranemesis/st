name: Spirit Tracks EUR1 conditional Clang matching search

on:
  push:
    paths:
      - 'research/eur1/batches/arm9_leaf500/search_conditional_round16.py'
      - 'research/eur1/batches/arm9_leaf500/search_grouped_round16.py'
      - 'research/eur1/batches/arm9_leaf500/search_straight_round17.py'
      - 'research/eur1/batches/arm9_leaf500/search_bit_tests_round17.py'
      - 'research/eur1/batches/arm9_leaf500/search_short_round18.py'
      - 'research/eur1/batches/arm9_leaf500/search_stores_round18.py'
      - 'research/eur1/batches/arm9_leaf500/rank_mismatches_round18.py'
      - 'research/eur1/batches/arm9_leaf500/search_high_bl_round19.py'
      - '.github/workflows/research-eur1-round16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and hash signed-condition and pointer-qualified C variants
        run: |
          python3 research/eur1/batches/arm9_leaf500/search_conditional_round16.py --out /tmp/st-round16-conditional.json
          python3 -c 'import json; j=json.load(open("/tmp/st-round16-conditional.json")); assert j["compiled_variants"]>100 and j["eligible_original_functions"]>=50'
      - name: Fold repeated ARM guards into C if-blocks and if-else patterns
        run: |
          python3 research/eur1/batches/arm9_leaf500/search_grouped_round16.py --out /tmp/st-round16-grouped.json
          python3 -c 'import json; j=json.load(open("/tmp/st-round16-grouped.json")); assert j["compiled_variants"]>400 and j["eligible_original_functions"]>=50'
      - name: Explore unbranched ARM C alternatives and source qualifiers
        run: |
          python3 research/eur1/batches/arm9_leaf500/search_straight_round17.py --out /tmp/st-round17-straight.json
          python3 -c 'import json; j=json.load(open("/tmp/st-round17-straight.json")); assert j["compiled_variants"]>100 and j["eligible_functions"]>70'
      - name: Compile and test masked ARM bit predicates
        run: |
          python3 research/eur1/batches/arm9_leaf500/search_bit_tests_round17.py --out /tmp/st-round17-bits.json
          python3 -c 'import json; j=json.load(open("/tmp/st-round17-bits.json")); assert j["eligible_functions"]>=20 and j["compiled_variants"]>=100'
      - name: Reconstruct short global and table-index functions in typed C
        run: |
          python3 research/eur1/batches/arm9_leaf500/search_short_round18.py --out /tmp/st-round18-short.json
          python3 -c 'import json; j=json.load(open("/tmp/st-round18-short.json")); assert j["compiled_variants"]>=100'
      - name: Search mutable-object and volatile-store C variants
        run: |
          python3 research/eur1/batches/arm9_leaf500/search_stores_round18.py --out /tmp/st-round18-stores.json
          python3 -c 'import json; j=json.load(open("/tmp/st-round18-stores.json")); assert j["compiled_variants"]>500'
      - name: Rank 448 actual mismatching ARM functions for instruction diagnostics
        run: |
          python3 research/eur1/batches/arm9_leaf500/rank_mismatches_round18.py --out /tmp/st-round18-ranked.json
          python3 -c 'import json; j=json.load(open("/tmp/st-round18-ranked.json")); assert j["compiled_functions"]==500 and j["exact"]==82 and j["not_exact"]==418'
      - name: Check 13 handwritten typed C reconstructions for full ARM matches
        run: |
          python3 research/eur1/batches/arm9_leaf500/search_high_bl_round19.py --out /tmp/st-round19-high-bl.json
          python3 -c 'import json; j=json.load(open("/tmp/st-round19-high-bl.json")); assert j["original_functions"]>=5 and j["compiled_variants"]>20'
      - name: Publish candidate matches
        uses: actions/upload-artifact@v4
        with:
          name: st-eur1-round16-conditional
          path: |
            /tmp/st-round16-conditional.json
            /tmp/st-round16-grouped.json
            /tmp/st-round17-straight.json
            /tmp/st-round17-bits.json
            /tmp/st-round18-short.json
            /tmp/st-round18-stores.json
            /tmp/st-round18-ranked.json
            /tmp/st-round19-high-bl.json
