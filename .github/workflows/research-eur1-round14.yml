name: Spirit Tracks EUR1 twenty-six C functions

on:
  push:
    paths:
      - 'research/eur1/batches/arm9_leaf500/semantic_candidates_round14.c'
      - 'research/eur1/batches/arm9_leaf500/verify_semantic_round14.py'
      - 'research/eur1/batches/arm9_leaf500/verify_fifth500_romfree.py'
      - 'research/eur1/batches/arm9_leaf500/arm9_leaf_500_part*.c'
      - 'research/eur1/batches/arm9_leaf500/test_semantic_round14.c'
      - 'research/eur1/batches/arm9_leaf500/manifest_fifth500.json'
      - '.github/workflows/research-eur1-round14.yml'
  pull_request:
    paths:
      - 'research/eur1/batches/arm9_leaf500/semantic_candidates_round14.c'
      - 'research/eur1/batches/arm9_leaf500/verify_semantic_round14.py'
      - 'research/eur1/batches/arm9_leaf500/verify_fifth500_romfree.py'
      - 'research/eur1/batches/arm9_leaf500/arm9_leaf_500_part*.c'
      - 'research/eur1/batches/arm9_leaf500/test_semantic_round14.c'
      - 'research/eur1/batches/arm9_leaf500/manifest_fifth500.json'
      - '.github/workflows/research-eur1-round14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    name: Verify ARM Clang and 26 semantic regression groups
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare all 26 compiled ARM functions with original EUR1 hashes
        run: |
          python3 research/eur1/batches/arm9_leaf500/verify_semantic_round14.py --out /tmp/st-round14-arm-hashes.json
          python3 -c 'import json; r=json.load(open("/tmp/st-round14-arm-hashes.json")); assert r["candidates"]==26 and len(r["functions"])==26'
      - name: Verify all 500 research functions and current 77/500 baseline
        run: |
          python3 research/eur1/batches/arm9_leaf500/verify_fifth500_romfree.py --out /tmp/st-fifth500-recheck.json
          python3 -c 'import json; j=json.load(open("/tmp/st-fifth500-recheck.json")); assert j["compiled_functions"]==500 and j["exact_clang_sha256"]==77'
      - name: Run 26 host semantic regression groups under ASan and UBSan
        run: |
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer research/eur1/batches/arm9_leaf500/test_semantic_round14.c -o /tmp/st-round14-host
          /tmp/st-round14-host
